[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-language-to-code"
version = "0.1.0"
description = "Reproducible data foundation for natural-language-to-code experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]
seq2seq = ["torch==2.7.0"]

[project.scripts]
nl2code = "nl2code.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["legacy", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
